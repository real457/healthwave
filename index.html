
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealthWave</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { 
            background-color: #0f172a; 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .channel-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            border-color: transparent;
        }

        .post-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .post-card:active {
            transform: scale(0.98);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="glass sticky top-0 z-40 px-5 py-4 flex justify-between items-center border-b border-white/5">
        <div>
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400 leading-tight">HealthWave</h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Health Awareness Platform</p>
        </div>
        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-90">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar (Hidden on small screens, shown as bottom bar or drawer) -->
        <aside class="hidden md:flex w-72 glass flex-col p-6 overflow-y-auto border-r border-white/5">
            <h2 class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-6">Explore Channels</h2>
            <nav id="sidebar-channels" class="space-y-2">
                <!-- Injected via JS -->
            </nav>
            <button onclick="addNewChannel()" class="mt-8 text-blue-400 hover:text-blue-300 text-sm font-semibold flex items-center gap-2 group">
                <span class="bg-blue-500/10 p-1 rounded group-hover:bg-blue-500/20 transition">+</span> 
                Add New Channel
            </button>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-[#020617]">
            <!-- Top Search & Stats -->
            <div class="p-4 md:p-6 space-y-4">
                <div class="relative">
                    <input type="text" onkeyup="filterPosts(this.value)" placeholder="Search health awareness..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 pl-12 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition">
                    <svg class="w-5 h-5 absolute left-4 top-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>

                <div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar md:hidden" id="mobile-channels">
                    <!-- Mobile channel chips injected here -->
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="glass p-3 rounded-2xl border-blue-500/10">
                        <p class="text-[10px] text-slate-500 font-bold uppercase">Members</p>
                        <p class="text-lg font-bold text-blue-100">2.8k</p>
                    </div>
                    <div class="glass p-3 rounded-2xl border-blue-500/10">
                        <p class="text-[10px] text-slate-500 font-bold uppercase">Activity</p>
                        <p class="text-lg font-bold text-emerald-400">High</p>
                    </div>
                    <div class="glass p-3 rounded-2xl border-blue-500/10">
                        <p class="text-[10px] text-slate-500 font-bold uppercase">Channel</p>
                        <p class="text-lg font-bold text-cyan-400" id="stat-channel">Live</p>
                    </div>
                </div>
            </div>

            <!-- Scrollable Feed -->
            <div id="feed" class="flex-1 overflow-y-auto px-4 md:px-6 pb-24 space-y-6">
                <!-- Posts injected here -->
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Nav Placeholder -->
    <div class="md:hidden glass fixed bottom-0 left-0 right-0 h-16 border-t border-white/5 flex justify-around items-center px-6 safe-area-bottom z-40">
        <button class="text-blue-500"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l1.293 1.293a1 1 0 001.414-1.414l-7-7z"/></svg></button>
        <button class="text-slate-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></button>
        <button class="text-slate-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg></button>
        <button class="text-slate-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></button>
    </div>

    <!-- Create Post Modal -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="glass w-full max-w-lg rounded-3xl overflow-hidden animate-in fade-in zoom-in duration-300">
            <div class="p-6 space-y-5">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold">Post Awareness</h2>
                    <button onclick="closeModal()" class="text-slate-500 hover:text-white">✕</button>
                </div>
                
                <div class="space-y-4">
                    <input id="post-title" type="text" placeholder="Title of Awareness" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 focus:outline-none focus:border-blue-500">
                    
                    <textarea id="post-content" placeholder="Share the message..." class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 h-32 focus:outline-none focus:border-blue-500"></textarea>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <select id="post-channel" class="bg-slate-800/50 border border-slate-700 rounded-xl p-3 text-slate-300">
                            <!-- Injected -->
                        </select>
                        <input id="post-tags" type="text" placeholder="#tags" class="bg-slate-800/50 border border-slate-700 rounded-xl p-3 focus:outline-none">
                    </div>

                    <div class="relative group">
                        <input type="file" id="post-image" accept="image/*" class="hidden" onchange="previewImage(this)">
                        <label for="post-image" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-700 rounded-2xl cursor-pointer group-hover:border-blue-500/50 transition bg-slate-800/30">
                            <div id="preview-container" class="flex flex-col items-center">
                                <svg class="w-8 h-8 text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                <span class="text-sm text-slate-400" id="upload-label">Upload Photo</span>
                            </div>
                            <img id="image-preview" class="hidden h-full w-full object-cover rounded-2xl">
                        </label>
                    </div>

                    <button onclick="submitPost()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95">Publish Awareness</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let channels = ["Mental Health", "Nutrition", "Fitness", "Heart Health", "Maternal Care", "Child Health", "Vaccines"];
        let currentChannel = "Mental Health";
        let posts = [
            {
                id: 1,
                title: "Hydration & Mental Clarity",
                content: "Did you know that even 2% dehydration can affect your focus and mood? Drink up!",
                channel: "Mental Health",
                tags: "#health #water",
                likes: 124,
                comments: 12,
                image: "https://images.unsplash.com/photo-1512428815833-b40dd21041c5?auto=format&fit=crop&q=80&w=1000",
                timestamp: "2h ago"
            },
            {
                id: 2,
                title: "Daily Cardio Routine",
                content: "A 30-minute brisk walk can lower blood pressure and improve heart health significantly.",
                channel: "Fitness",
                tags: "#cardio #fitness",
                likes: 89,
                comments: 5,
                image: "https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&q=80&w=1000",
                timestamp: "5h ago"
            }
        ];

        function renderChannels() {
            const sidebar = document.getElementById('sidebar-channels');
            const mobile = document.getElementById('mobile-channels');
            const select = document.getElementById('post-channel');

            const channelHtml = channels.map(c => `
                <button onclick="setChannel('${c}')" class="channel-btn w-full text-left px-4 py-3 rounded-xl text-sm font-medium transition-all ${currentChannel === c ? 'active' : 'text-slate-400 hover:bg-white/5'}">
                    ${c}
                </button>
            `).join('');

            const mobileHtml = channels.map(c => `
                <button onclick="setChannel('${c}')" class="whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition-all ${currentChannel === c ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}">
                    ${c}
                </button>
            `).join('');

            sidebar.innerHTML = channelHtml;
            mobile.innerHTML = mobileHtml;
            select.innerHTML = channels.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('stat-channel').innerText = currentChannel.split(' ')[0];
        }

        function setChannel(name) {
            currentChannel = name;
            renderChannels();
            renderFeed();
        }

        function renderFeed(filter = "") {
            const feed = document.getElementById('feed');
            const filtered = posts.filter(p => 
                p.channel === currentChannel && 
                (p.title.toLowerCase().includes(filter.toLowerCase()) || p.content.toLowerCase().includes(filter.toLowerCase()))
            );

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-600">
                        <svg class="w-16 h-16 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                        <p class="font-medium">No awareness posts in this channel yet.</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = filtered.map(p => `
                <div class="post-card glass rounded-3xl overflow-hidden">
                    <img src="${p.image}" class="w-full h-56 object-cover" loading="lazy">
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="text-[10px] text-blue-400 font-bold uppercase tracking-tighter">${p.timestamp} • ${p.channel}</span>
                                <h3 class="text-xl font-bold text-white mt-1">${p.title}</h3>
                            </div>
                        </div>
                        <p class="text-slate-300 text-sm leading-relaxed mb-4 line-clamp-3">${p.content}</p>
                        <div class="text-blue-500 text-xs font-medium mb-5">${p.tags}</div>
                        
                        <div class="flex items-center justify-between pt-4 border-t border-white/5">
                            <div class="flex gap-4">
                                <button class="flex items-center gap-1.5 text-slate-400 hover:text-pink-500 transition group">
                                    <svg class="w-5 h-5 group-active:scale-125 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                                    <span class="text-xs font-bold">${p.likes}</span>
                                </button>
                                <button class="flex items-center gap-1.5 text-slate-400 hover:text-blue-400 transition">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                                    <span class="text-xs font-bold">${p.comments}</span>
                                </button>
                            </div>
                            <button class="text-slate-400 hover:text-white transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterPosts(val) {
            renderFeed(val);
        }

        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('image-preview').classList.remove('hidden');
                    document.getElementById('preview-container').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function submitPost() {
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const channel = document.getElementById('post-channel').value;
            const tags = document.getElementById('post-tags').value;
            const imgInput = document.getElementById('post-image');

            if(!title || !content) {
                alert("Please add a title and content.");
                return;
            }

            const newPost = {
                id: Date.now(),
                title,
                content,
                channel,
                tags: tags || "#health",
                likes: 0,
                comments: 0,
                image: document.getElementById('image-preview').src || "https://images.unsplash.com/photo-1505751172177-51ad1859f1e2?auto=format&fit=crop&q=80&w=1000",
                timestamp: "Just now"
            };

            posts.unshift(newPost);
            closeModal();
            setChannel(channel);
            
            // Reset form
            document.getElementById('post-title').value = "";
            document.getElementById('post-content').value = "";
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('preview-container').classList.remove('hidden');
        }

        function addNewChannel() {
            const name = prompt("Enter new channel name:");
            if (name && !channels.includes(name)) {
                channels.push(name);
                renderChannels();
            }
        }

        // Initialize
        renderChannels();
        renderFeed();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('HealthWave SW registered.');
                });
            });
        }
    </script>
</body>
</html>
